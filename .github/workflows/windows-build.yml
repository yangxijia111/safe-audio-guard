name: Windows compile check
on:
  push:
  workflow_dispatch:
  pull_request:
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Policy checks
        run: dotnet run --project SafeAudioGuard.PolicyTests/SafeAudioGuard.PolicyTests.csproj -c Release
      - name: Windows x64 publish
        shell: pwsh
        run: ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SafeAudioGuard-win-x64
          path: dist/SafeAudioGuard.exe
          if-no-files-found: error
